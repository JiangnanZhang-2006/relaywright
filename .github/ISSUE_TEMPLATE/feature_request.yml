name: 功能建议
description: 提出新功能或改进
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 你在做什么任务时遇到了困难。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议的做法
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的其他做法
  - type: checkboxes
    id: scope
    attributes:
      label: 范围确认
      options:
        - label: 这个功能不用于绕过验证码或风控、刷课刷时长、批量注册账号等损害网站的用途（见 CONTRIBUTING.md）。
          required: true
